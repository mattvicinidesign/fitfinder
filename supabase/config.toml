# Supabase local development configuration.
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "fitfinder"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://localhost:3000/auth/callback",
  "fitfinder://auth-callback",
  "fitfinder://**",
  "capacitor://localhost/auth/callback",
  "capacitor://localhost/**",
]
jwt_expiry = 3600
enable_signup = true
# Guest Mode relies on anonymous sign-in.
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

# Magic link sign-in is enabled via the email provider above.

# Anonymous sign-in powers Guest Mode.
[auth.sessions]
[auth.external.apple]
enabled = false # set client_id / secret in dashboard for Sign In With Apple

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.parse-resume]
verify_jwt = true

[functions.parse-job]
verify_jwt = true

[functions.analyze]
verify_jwt = true
