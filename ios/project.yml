# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
# (install with `brew install xcodegen`). The .xcodeproj is gitignored and
# regenerated from this file, so this YAML is the source of truth.

name: FitFinder
options:
  bundleIdPrefix: com.fitfinder
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "" # set your Apple Developer team ID
    GENERATE_INFOPLIST_FILE: NO

targets:
  FitFinder:
    type: application
    platform: iOS
    sources:
      - path: FitFinder
    info:
      path: FitFinder/Info.plist
      properties:
        CFBundleDisplayName: Fit Finder
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - fitfinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitfinder.app
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: FitFinder/FitFinder.entitlements
    entitlements:
      path: FitFinder/FitFinder.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - package: Supabase
        product: Supabase
